<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#pwa-grad)"/>
  <!-- Inner circular glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Wallet / Financial Shield Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Wallet body -->
    <rect x="20" y="50" width="260" height="200" rx="36" fill="#ffffff"/>
    <path d="M20 100 C20 72.38 42.38 50 70 50 L230 50 C257.62 50 280 72.38 280 100 L280 110 L20 110 Z" fill="#EEF2FF"/>
    <!-- Wallet flap -->
    <rect x="180" y="115" width="100" height="70" rx="20" fill="#4F46E5"/>
    <circle cx="220" cy="150" r="14" fill="#FBBF24"/>
    <!-- Growth spark -->
    <path d="M70 180 L110 140 L140 170 L200 110" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="175,110 200,110 200,135" stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
